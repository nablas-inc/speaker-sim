services:
  app_run:
    image: ss-app:latest
    build:
      context: .
    stdin_open: true
    tty: true
    ports:
      - '8501:8501'
      - '8000:8000'
    environment:
      APP_MODE: ${APP_MODE:-streamlit}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
